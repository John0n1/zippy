name: Build Debian Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the Debian package to
        required: true
        default: v2.1.0

permissions:
  contents: write

jobs:
  deb-build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.release.tag_name }}

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            devscripts equivs ca-certificates git build-essential
          mk-build-deps \
            --install \
            --remove \
            --tool 'apt-get -y --no-install-recommends' \
            debian/control

      - name: Build .deb package
        run: |
          dpkg-buildpackage -us -uc -b
          cp ../zippy_*.deb ./

      - name: Upload .deb as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          files: zippy_*.deb
